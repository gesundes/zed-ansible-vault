[package]
name = "zed-ansible-vault-extension"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
sha2 = "0.10"
zed_extension_api = "0.7.0"

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["server"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/gesundes/zed-ansible-vault"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[lints]
workspace = true
