name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.97.1

jobs:
  rust:
    name: Rust, WASM, and dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check release version contract
        run: ./scripts/check-release-version.sh
      - name: Test macOS deployment metadata verifier
        run: ./scripts/test-macos-deployment-target.sh
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build Zed WASM extension
        run: cargo build -p zed-ansible-vault-extension --release --locked --target wasm32-wasip2
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

  ansible-round-trip:
    name: ansible-core ${{ matrix.ansible-core }} round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ansible-core: ["2.19", "2.20", "2.21"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ansible-${{ matrix.ansible-core }}
      - name: Install ansible-core
        run: |
          python3 -m venv "/tmp/ansible-core-${{ matrix.ansible-core }}"
          "/tmp/ansible-core-${{ matrix.ansible-core }}/bin/pip" install "ansible-core~=${{ matrix.ansible-core }}.0"
          echo "/tmp/ansible-core-${{ matrix.ansible-core }}/bin" >> "$GITHUB_PATH"
      - name: Run real Ansible Vault tests
        run: cargo test -p ansible-vault-lsp --locked -- --ignored

  zed-package:
    name: Official Zed package validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-wasip2
      - name: Validate with the official Zed extension packager
        run: ./scripts/check-zed-package.sh
