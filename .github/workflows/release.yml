name: Release native companions

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.97.1

jobs:
  validate:
    name: Validate release contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate tag and project versions
        run: ./scripts/check-release-version.sh "$GITHUB_REF_NAME"

  native:
    name: Build ${{ matrix.asset }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: ansible-vault-lsp-darwin-x86_64
            platform: macos
            architecture: x86_64
            deployment_target: 10.15.7
            expected_minos: "10.15.7"
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: ansible-vault-lsp-darwin-aarch64
            platform: macos
            architecture: arm64
            deployment_target: "11.0"
            expected_minos: "11.0"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: ansible-vault-lsp-linux-x86_64
            platform: linux
            architecture: x86-64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: ansible-vault-lsp-linux-aarch64
            platform: linux
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - name: Install musl compiler
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build companion
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build -p ansible-vault-lsp --release --locked --target "${{ matrix.target }}"
      - name: Prepare release asset
        run: |
          cp "target/${{ matrix.target }}/release/ansible-vault-lsp" "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - name: Smoke test version
        run: |
          test "$(./${{ matrix.asset }} --version)" = "${GITHUB_REF_NAME#v}"
      - name: Verify Linux architecture and static linkage
        if: matrix.platform == 'linux'
        run: |
          file "${{ matrix.asset }}" | grep -qi "${{ matrix.architecture }}"
          file "${{ matrix.asset }}" | grep -qi "static"
      - name: Verify macOS architecture and deployment target
        if: matrix.platform == 'macos'
        run: |
          file "${{ matrix.asset }}" | grep -qi "${{ matrix.architecture }}"
          otool -l "${{ matrix.asset }}" | \
            ./scripts/verify-macos-deployment-target.sh "${{ matrix.expected_minos }}"
      - name: Upload native asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attest and publish GitHub Release
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Download native assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Generate combined checksums
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          sha256sum \
            ansible-vault-lsp-darwin-x86_64 \
            ansible-vault-lsp-darwin-aarch64 \
            ansible-vault-lsp-linux-x86_64 \
            ansible-vault-lsp-linux-aarch64 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx \
            --manifest-path server/Cargo.toml \
            --format json \
            --all \
            --spec-version 1.5 \
            --override-filename ansible-vault-lsp-sbom
          mv server/ansible-vault-lsp-sbom.json \
            "${{ runner.temp }}/release-assets/ansible-vault-lsp-sbom.json"
          test -s "${{ runner.temp }}/release-assets/ansible-vault-lsp-sbom.json"
      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/release-assets/*
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_DIRECTORY: ${{ runner.temp }}/release-assets
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; release assets must never be replaced" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$ASSET_DIRECTORY"/* \
            --generate-notes \
            --title "Ansible Vault for Zed $GITHUB_REF_NAME" \
            --verify-tag
