[package]
name = "ansible-vault-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
dashmap = "6"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.0.1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tower-lsp = "0.20"
tree-sitter = "0.25"
tree-sitter-yaml = "0.7"
which = "8"
zeroize = "1"

[dev-dependencies]
pretty_assertions = "1"
proptest = "1"

[lints]
workspace = true
